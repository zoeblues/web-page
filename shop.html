        <hr class="hr-centre">
      <h2 id="shop-title">Van Gogh Postcards: Yours, Uniquely!</h2>
    <section class="section-gallery">
   <h1 id="order-title">Order a Personalized Postcard</h1>
      
          <form action="submit_order.php" method="post">
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required>
              <br>
      
              <label for="surname">Surname:</label>
              <input type="text" id="surname" name="surname" required>
              <br>
      
              <label for="address">Address:</label>
              <input type="text" id="address" name="address" required>
              <br>
      
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required>
              <br>
      
              <label for="phone">Phone Number:</label>
              <input type="tel" id="phone" name="phone" required>
              <br>
      
              <label>Pack for Present:</label>
              <input type="radio" id="yes" name="present_pack" value="yes">
              <label for="yes">Yes</label>
              <input type="radio" id="no" name="present_pack" value="no">
              <label for="no">No</label>
              <br>
      
              <label>Postcard Design:</label>
              <input type="checkbox" id="design1" name="design[]" value="design1">
              <label for="design1">Design 1</label>
              <input type="checkbox" id="design2" name="design[]" value="design2">
              <label for="design2">Design 2</label>
              <input type="checkbox" id="design3" name="design[]" value="design3">
              <label for="design3">Design 3</label>
              <input type="checkbox" id="design4" name="design[]" value="design4">
              <label for="design4">Design 4</label>
              <br>
              <input type="submit" value="Submit">
              <input type="reset" value="Reset">
          </form>
   <div class="animated-rectangle">
  Thank You!
</div>
      </section>
